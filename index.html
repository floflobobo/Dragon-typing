<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Clavier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Mise en page : nuit étoilée au-dessus des montagnes aux dragons ; contenus sur cartes parchemin ; zone de jeu au centre, vrai clavier AZERTY en bas */
:root{
  color-scheme: dark;
  --nuit:#10233a; --nuit2:#173250; --brume:#2b4e70; --touche:#24425f; --touche-ombre:#0a1828;
  --parchemin:#fbf1d9; --parchemin2:#efdfb8; --encre:#2d2116; --encre-douce:#76624b;
  --braise:#ff7a2f; --or:#ffcf4a; --or-fonce:#c99a1e; --ecaille:#2fb67c; --ecaille-fonce:#1b7a52; --rubis:#e34a4f; --ciel:#d6e9ff; --ciel-doux:#9db7d3;
  --f-lp:#c08bf5; --f-lr:#5aa6f5; --f-lm:#3fcf9d; --f-li:#ffc23d; --f-ri:#ff9455; --f-rm:#3fcf9d; --f-rr:#5aa6f5; --f-rp:#c08bf5; --f-th:#b9c4cf;
  --display:'Grandstander','Comic Sans MS',system-ui,sans-serif;
  --body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --lettre:'Andika','Lexend',system-ui,sans-serif;
}
html,body{min-height:100%}
body{background:var(--nuit);background-image:radial-gradient(ellipse 120% 70% at 50% -10%,var(--brume),var(--nuit) 65%);color:var(--ciel);font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;overflow-x:hidden}
.ciel{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent 60%),radial-gradient(1px 1px at 90px 120px,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 160px 60px,#ffe8a8,transparent 60%),radial-gradient(1px 1px at 230px 170px,#fff,transparent 60%),radial-gradient(1px 1px at 60px 210px,#cfe3ff,transparent 60%);
  background-size:260px 240px}
.montagnes{position:fixed;left:0;right:0;bottom:0;height:140px;pointer-events:none;z-index:0;opacity:.55}
.app{position:relative;z-index:1;max-width:1000px;margin:0 auto}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}

/* En-tête */
.entete{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ciel);padding:0}
.logo .dragon{width:58px;height:46px}
.logo span{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.01em}
.logo span b{color:var(--or);font-weight:800}
.entete .espace{flex:1}
.pastille{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-weight:500;font-size:.95rem;color:var(--ciel)}
.pastille svg{width:18px;height:18px}
.btn-lien{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--ciel);border-radius:999px;padding:6px 14px;font-weight:500}
.btn-lien:hover{background:rgba(255,255,255,.16)}

/* Boutons */
.btn{border:0;border-radius:16px;padding:12px 22px;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--or);color:var(--encre);box-shadow:0 5px 0 var(--or-fonce);transition:transform .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--or-fonce)}
.btn.vert{background:var(--ecaille);color:#fff;box-shadow:0 5px 0 var(--ecaille-fonce)}
.btn.doux{background:var(--parchemin2);box-shadow:0 5px 0 #c9b48a}
.btn.petit{padding:8px 14px;font-size:.95rem;border-radius:12px}

/* Cartes parchemin */
.carte{background:var(--parchemin);color:var(--encre);border-radius:22px;padding:22px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.titre-section{font-size:1.45rem;color:var(--ciel);margin:28px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.titre-section small{font-family:var(--body);font-size:.9rem;font-weight:400;color:var(--ciel-doux)}

/* Accueil */
.heros{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.heros .dragon{width:170px;height:130px}
.heros h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.heros p{margin:6px 0 14px;color:var(--encre-douce);max-width:52ch}
.heros .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.champ{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.champ input{font:500 1.15rem var(--body);padding:10px 14px;border-radius:12px;border:2px solid var(--parchemin2);background:#fff;color:var(--encre);min-width:0;width:220px;max-width:100%}
@media (max-width:560px){.heros{grid-template-columns:1fr}.heros .dragon{width:120px;height:92px}}

.chemin{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.pierre{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--parchemin);color:var(--encre);border:0;border-radius:20px;padding:14px 8px 10px;box-shadow:0 6px 0 rgba(0,0,0,.25);text-align:center}
.pierre:hover:not(:disabled){transform:translateY(-2px)}
.pierre .num{position:absolute;top:8px;left:10px;font:700 .8rem var(--body);color:var(--encre-douce)}
.pierre .touches{font:700 1.6rem/1.1 var(--lettre);letter-spacing:.08em;min-height:1.8rem}
.pierre .nom{font-size:.82rem;line-height:1.25;color:var(--encre-douce);min-height:2.1em}
.pierre .etoiles{display:flex;gap:2px}
.pierre .etoiles svg{width:18px;height:18px}
.pierre:disabled{background:#3a5774;color:var(--ciel-doux);cursor:not-allowed;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.pierre:disabled .nom,.pierre:disabled .num{color:var(--ciel-doux)}
.pierre.suivante{outline:3px solid var(--or);outline-offset:3px}
.pierre.suivante::after{content:"À toi !";position:absolute;top:-12px;right:-6px;background:var(--braise);color:#fff;font:800 .75rem var(--display);padding:3px 8px;border-radius:999px;transform:rotate(6deg)}

.jeux{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.jeu-carte{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;background:var(--parchemin);color:var(--encre);border-radius:22px;padding:18px;box-shadow:0 7px 0 rgba(0,0,0,.25)}
.jeu-carte:hover{transform:translateY(-2px)}
.jeu-carte .illu{height:96px;display:grid;place-items:center;border-radius:14px;background:var(--nuit2);margin-bottom:6px;overflow:hidden}
.jeu-carte h3{font-size:1.25rem}
.jeu-carte p{margin:0;font-size:.92rem;color:var(--encre-douce)}
.jeu-carte .record{margin-top:auto;padding-top:6px;font-size:.85rem;font-weight:700;color:var(--ecaille-fonce)}

/* Écran de jeu */
.barre-jeu{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.barre-jeu h2{font-size:1.5rem;flex:1;min-width:0}
.astuce{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.22);border-radius:16px;padding:10px 14px;margin-bottom:14px;color:var(--ciel)}
.astuce .dragon{width:56px;height:44px;flex:none}
.progression{height:12px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:14px}
.progression i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--braise),var(--or));border-radius:999px;transition:width .3s}

.texte{background:var(--parchemin);color:#a8987f;border-radius:22px;padding:22px 20px;font-family:var(--lettre);font-size:clamp(26px,5vw,42px);line-height:1.55;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25);min-height:2.6em;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0}
.texte.long{font-size:clamp(22px,3.6vw,32px);justify-content:flex-start;text-align:left}
.mot{display:inline-flex;white-space:nowrap}
.c{display:inline-block;padding:0 .04em;border-radius:8px;transition:color .1s}
.c.esp{min-width:.55em;color:#cdbf9f}
.c.fait{color:var(--ecaille-fonce)}
.c.repris{color:var(--braise)}
.c.cur{background:var(--or);color:var(--encre);box-shadow:0 4px 0 var(--or-fonce);transform:translateY(-2px)}
.c.esp.cur::after{content:"";display:block;height:.12em;margin-top:-.25em}
.c.faux{animation:secoue .28s;background:var(--rubis);color:#fff;box-shadow:0 4px 0 #9d2a2e}
@keyframes secoue{0%,100%{translate:0}25%{translate:-5px}75%{translate:5px}}

.doigt-info{text-align:center;margin:14px 0 6px;font-weight:500;color:var(--ciel)}
.doigt-info b{display:inline-block;padding:2px 10px;border-radius:999px;color:var(--encre);background:var(--fc,var(--or))}

/* Clavier AZERTY */
.kb-zone{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.kb{--u:min(50px,calc((100vw - 52px)/13.6));display:flex;flex-direction:column;gap:calc(var(--u)*.1);background:rgba(0,0,0,.22);padding:calc(var(--u)*.18);border-radius:calc(var(--u)*.3);max-width:100%}
.kb .rang{display:flex;gap:calc(var(--u)*.1)}
.kb .cale{flex:none}
.touche{flex:none;width:var(--u);height:calc(var(--u)*.92);border-radius:calc(var(--u)*.2);border:0;padding:0;background:var(--touche);color:var(--ciel);font:700 calc(var(--u)*.38)/1 var(--lettre);box-shadow:0 3px 0 var(--touche-ombre);position:relative;display:grid;place-items:center;touch-action:manipulation;transition:transform .08s,background .15s}
.touche sup{position:absolute;top:3px;left:5px;font:500 calc(var(--u)*.2)/1 var(--body);color:var(--ciel-doux)}
.touche.bosse::after{content:"";position:absolute;bottom:calc(var(--u)*.14);left:35%;right:35%;height:2px;border-radius:2px;background:var(--ciel-doux)}
.touche.espace{width:calc(var(--u)*6.2)}
.kb.zones .touche{box-shadow:inset 0 -4px 0 var(--fz,transparent),0 3px 0 var(--touche-ombre)}
.touche.cible{background:var(--fc);color:var(--encre);transform:translateY(-3px);animation:brille 1.2s ease-in-out infinite}
.touche.cible sup{color:var(--encre)}
.touche.appui{transform:translateY(2px);box-shadow:0 1px 0 var(--touche-ombre)}
.touche.oups{background:var(--rubis);color:#fff}
@keyframes brille{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.kb.chaleur .touche{background:var(--hz,var(--touche));color:var(--hzc,var(--ciel))}
.mains{width:min(300px,80vw);height:auto}
.mains .paume{fill:#e8d5ad}
.mains .doigt{fill:#e8d5ad;transition:fill .15s}
.mains .doigt.actif{fill:var(--fc)}

/* Œufs qui tombent */
.arene{position:relative;height:clamp(300px,50vh,440px);border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#132c47 0%,#1d4166 70%,#2a5a4b 70%,#244e41 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.arene .sol{position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 18px,transparent 18px 36px)}
.oeuf{position:absolute;left:0;top:0;width:58px;height:70px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;display:grid;place-items:center;font:700 30px/1 var(--lettre);color:var(--encre);background:var(--oc);box-shadow:inset -6px -8px 0 rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.25);will-change:transform}
.oeuf::before,.oeuf::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.45)}
.oeuf::before{width:9px;height:7px;top:12px;left:14px}
.oeuf::after{width:6px;height:6px;bottom:14px;right:12px;background:rgba(0,0,0,.12)}
.oeuf.eclot{animation:eclot .35s forwards}
.oeuf.casse{animation:casse .5s forwards}
@keyframes eclot{to{transform:var(--pos) scale(1.6);opacity:0;filter:brightness(2)}}
@keyframes casse{30%{transform:var(--pos) scaleY(.7)}to{transform:var(--pos) scaleY(.3);opacity:0}}
.dragon-tir{position:absolute;left:50%;bottom:6px;width:120px;height:92px;translate:-50% 0}
.boule{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff3b0,var(--or) 40%,var(--braise) 75%);box-shadow:0 0 18px var(--braise);transition:transform .18s linear;pointer-events:none}
.vies{display:flex;gap:4px}
.vies svg{width:24px;height:24px}
.toast{position:absolute;left:50%;top:30%;translate:-50% 0;font:800 2rem var(--display);color:var(--or);text-shadow:0 3px 0 rgba(0,0,0,.4);animation:toast 1.2s forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;scale:.6}20%{opacity:1;scale:1.1}80%{opacity:1}100%{opacity:0;translate:-50% -30px}}

.voile{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,24,40,.72);z-index:5;padding:16px}
.voile .carte{max-width:460px;text-align:center}
.voile h3{font-size:1.6rem;margin-bottom:6px}
.voile p{margin:6px 0 14px;color:var(--encre-douce)}
.choix{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.choix button{border:2px solid var(--parchemin2);background:#fff;color:var(--encre);border-radius:12px;padding:8px 14px;font-weight:700}
.choix button[aria-pressed="true"]{background:var(--ecaille);border-color:var(--ecaille);color:#fff}

/* Course */
.piste{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#183a5c,#21507a);padding:12px 12px 12px;display:grid;gap:8px}
.couloir{position:relative;height:86px;border-radius:14px;background:rgba(255,255,255,.06);border-bottom:2px dashed rgba(255,255,255,.18)}
.couloir .nom-c{position:absolute;left:10px;top:6px;font-size:.8rem;font-weight:700;color:var(--ciel-doux);z-index:1}
.couloir .dragon{position:absolute;bottom:2px;left:0;width:96px;height:74px;transition:left .15s linear}
.arrivee{position:absolute;right:10px;top:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,#fff 0 10px,#1a1a1a 10px 20px);opacity:.75;border-radius:3px}
.tour{position:absolute;right:26px;bottom:6px;width:34px;height:60px}

/* Chrono */
.chrono-zone{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.sablier{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--or) calc(var(--p,1)*360deg),rgba(255,255,255,.1) 0);position:relative}
.sablier::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--nuit)}
.sablier span{position:relative;font:800 2.2rem var(--display);font-variant-numeric:tabular-nums}
.sablier small{position:relative;display:block;font-size:.75rem;text-align:center;margin-top:-6px;color:var(--ciel-doux)}
.suivants{margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font:700 1.3rem var(--lettre);color:var(--ciel-doux)}
.compteur{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
@media (max-width:560px){.chrono-zone{grid-template-columns:1fr;justify-items:center}}

/* Résultats & stats */
.res-etoiles{display:flex;justify-content:center;gap:8px;margin:6px 0 10px}
.res-etoiles svg{width:48px;height:48px}
.res-etoiles svg.gagne{animation:pop .5s backwards}
.res-etoiles svg:nth-child(2){animation-delay:.15s}.res-etoiles svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{scale:0;rotate:-40deg}}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:10px 0 16px}
.chiffre{background:var(--parchemin2);border-radius:14px;padding:10px;text-align:center}
.chiffre b{display:block;font:800 1.7rem/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--encre)}
.chiffre span{font-size:.8rem;color:var(--encre-douce)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tuile{background:var(--parchemin);color:var(--encre);border-radius:20px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.tuile b{display:block;font:800 2rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.tuile span{font-size:.85rem;color:var(--encre-douce)}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ciel-doux);justify-content:center}
.legende i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.puces{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.puce{font:700 1.3rem var(--lettre);background:var(--parchemin);color:var(--encre);border-radius:12px;padding:4px 14px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.puce small{font:500 .75rem var(--body);color:var(--rubis);margin-left:6px}
.historique{width:100%;border-collapse:collapse;font-size:.92rem}
.historique th{text-align:left;font-weight:500;color:var(--encre-douce);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px}
.historique td{padding:8px;border-top:1px solid var(--parchemin2);font-variant-numeric:tabular-nums}
.barre-mpm{height:10px;border-radius:999px;background:var(--braise);min-width:4px}
.tableau{overflow-x:auto}
.vide{color:var(--encre-douce);text-align:center;padding:12px}

.reglages{display:grid;gap:18px;max-width:560px}
.reglage{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.reglage label,.reglage .lbl{font-weight:700}
.reglage p{margin:2px 0 0;font-size:.85rem;color:var(--encre-douce)}
.interrupteur{width:62px;height:34px;border-radius:999px;border:0;background:#cdbf9f;position:relative;flex:none}
.interrupteur::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.interrupteur[aria-checked="true"]{background:var(--ecaille)}
.interrupteur[aria-checked="true"]::after{left:32px}

.focus-alerte{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:20;background:var(--braise);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.4)}

.dragon .aile{transform-origin:56px 40px;animation:bat 1.6s ease-in-out infinite}
@keyframes bat{50%{transform:rotate(-12deg) scaleY(.85)}}
.dragon .feu{opacity:0;transform-origin:112px 48px}
.dragon.souffle .feu{animation:feu .3s}
@keyframes feu{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

</head>
<body>
<div class="ciel" aria-hidden="true"></div>
<svg class="montagnes" viewBox="0 0 1200 140" preserveAspectRatio="none" aria-hidden="true"><path d="M0 140 L0 90 L120 40 L220 95 L330 30 L470 100 L600 50 L720 105 L860 25 L990 95 L1100 55 L1200 85 L1200 140Z" fill="#0b1a2b"/><path d="M0 140 L0 115 L160 80 L300 120 L450 85 L620 125 L780 90 L930 125 L1080 95 L1200 115 L1200 140Z" fill="#081422"/></svg>

<div class="app">
  <header class="entete">
    <button class="logo" id="logo" aria-label="Retour à la carte">
      <span id="logoDragon"></span><span>Dragon <b>Clavier</b></span>
    </button>
    <div class="espace"></div>
    <span class="pastille" id="totEtoiles"></span>
    <button class="btn-lien" id="btnStats">Mon grimoire</button>
    <button class="btn-lien" id="btnReglages">Réglages</button>
  </header>
  <main id="main"></main>
</div>
<div class="focus-alerte" id="focusAlerte" hidden>Clique sur le jeu pour continuer à taper</div>

<script>
/* ---------- Données ---------- */
const KEY='dragon-clavier-v1';
function defaults(){return{name:'',age:'petits',sound:true,voice:true,zones:true,lessons:{},best:{chute:0,course:0,chrono:0},keys:{},sessions:[],timeMs:0}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');const d=defaults();if(r){Object.assign(d,r);d.best=Object.assign(defaults().best,r.best||{})}return d}catch(e){return defaults()}}

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d=.08,type='sine',vol=.07,when=0){if(!S.sound)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
const SFX={ok(){tone(620+Math.random()*90,.07,'triangle',.06)},ko(){tone(150,.15,'square',.03)},pop(){tone(880,.06);tone(1320,.09,'sine',.05,.05)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.07,i*.11))},lose(){[392,330,262].forEach((f,i)=>tone(f,.22,'triangle',.06,i*.15))},tic(){tone(1000,.03,'sine',.03)}};

function makeTyper(el,text,cnt,o={}){const T={text,i:0,el,fini:false,erreurIci:false};

 T.maj=()=>{T.spans.forEach(s=>s.classList.remove('cur'));if(T.i<T.text.length){T.spans[T.i].classList.add('cur');if(o.cible!==false)montreCible(T.text[T.i])}};
 T.press=ch=>{if(T.fini)return;const exp=T.text[T.i];if(!cnt.t0)cnt.t0=performance.now();
  if(ch===exp){cnt.ok++;noteTouche(exp,!T.erreurIci);const s=T.spans[T.i];s.classList.remove('faux');s.classList.add(T.erreurIci?'repris':'fait');T.erreurIci=false;T.i++;flashTouche(ch,true);SFX.ok();o.onOk&&o.onOk();T.maj();if(T.i>=T.text.length){T.fini=true;o.onDone&&o.onDone()}}
  else{cnt.ko++;if(!T.erreurIci)noteTouche(exp,false);T.erreurIci=true;const s=T.spans[T.i];s.classList.remove('faux');void s.offsetWidth;s.classList.add('faux');flashTouche(ch,false);SFX.ko();o.onKo&&o.onKo()}};
 T.maj();return T}

function genLecon(L,idx){const p=S.age==='petits';const n=p?5:7;
 if(L.id==='phr')return shuffle(PHRASES.slice()).slice(0,p?3:5);
 const known=L.known||lettresJusqua(idx);const nouv=[...L.nouv];const lignes=[];
 let g=nouv.map(c=>c.repeat(3));while(g.length<n)g.push(Array.from({length:p?2:3},()=>rnd(nouv)).join(''));lignes.push(g.slice(0,n).join(' '));
 const melange=()=>{const r=[];for(let k=0;k<n;k++){const len=2+Math.floor(Math.random()*(p?2:3));let s=[rnd(nouv)];while(s.length<len)s.push(rnd(Math.random()<.55?nouv:known));r.push(shuffle(s).join(''))}return r.join(' ')};
 lignes.push(melange());
 const mots=shuffle(DICO.filter(w=>[...w].every(c=>known.includes(c))&&[...w].some(c=>nouv.includes(c))&&(!p||w.length<=6)));
 if(mots.length>=3)lignes.push(mots.slice(0,p?4:6).join(' '));else lignes.push(melange());
 if(!p)lignes.push(mots.length>=8?mots.slice(6,12).join(' '):melange());
 return lignes}

VUES.chute=()=>{

 $('#retour').onclick=()=>go('carte');
 const ar=$('#arene');const COUL=['#9fe3c4','#ffd27a','#c6b6ff','#ffb3a7','#a9d8ff'];
 const G={run:false,eggs:[],vies:3,score:0,rates:0,ko:0,speed:p?32:52,interval:p?2.5:1.7,min:p?1:.6,spawn:.3,last:0,raf:0,t0:0};

 const cibleBasse=()=>{const e=G.eggs.reduce((m,e)=>!m||e.y>m.y?e:m,null);montreCible(e?e.l:null)};
 const ponte=()=>{const W=ar.clientWidth;const sur=new Set(G.eggs.map(e=>e.l));let l=rnd(pool),essai=0;while(sur.has(l)&&essai++<6)l=rnd(pool);const el=document.createElement('div');el.className='oeuf';el.textContent=l;el.style.setProperty('--oc',rnd(COUL));const e={l,el,x:10+Math.random()*(W-80),y:-72};ar.appendChild(el);G.eggs.push(e);if(G.eggs.length===1&&p)dire(l)};
 const retire=(e,cls)=>{G.eggs=G.eggs.filter(x=>x!==e);e.el.style.setProperty('--pos',`translate(${e.x}px,${e.y}px)`);e.el.classList.add(cls);setTimeout(()=>e.el.remove(),500);cibleBasse()};
 const boucle=ts=>{if(!G.run)return;const dt=Math.min(.05,(ts-(G.last||ts))/1000);G.last=ts;G.spawn-=dt;if(G.spawn<=0){ponte();G.spawn=G.interval;cibleBasse()}const H=ar.clientHeight;for(const e of [...G.eggs]){e.y+=G.speed*dt;e.el.style.transform=`translate(${e.x}px,${e.y}px)`;if(e.y>H-78){noteTouche(e.l,false);G.rates++;G.vies--;majVies();SFX.lose();retire(e,'casse');if(G.vies<=0){fin();return}}}G.raf=requestAnimationFrame(boucle)};
 const depart=()=>{const v=ar.querySelector('.voile');if(v)v.remove();G.run=true;G.last=0;if(!G.t0)G.t0=performance.now();G.raf=requestAnimationFrame(boucle)};
 const pause=()=>{if(!G.run)return;G.run=false;cancelAnimationFrame(G.raf);const v=document.createElement('div');v.className='voile';v.innerHTML=`<div class="carte"><h3>Pause</h3><p>Les œufs t'attendent.</p><div class="btns"><button class="btn vert" id="rep">Reprendre</button><button class="btn doux" id="quit">Carte</button></div></div>`;ar.appendChild(v);$('#rep').onclick=depart;$('#quit').onclick=()=>go('carte')};

 const tir=e=>{const d=ar.querySelector('.dragon-tir');const dr=d.getBoundingClientRect(),a=ar.getBoundingClientRect();const sx=dr.left-a.left+dr.width*.96,sy=dr.top-a.top+dr.height*.48;const b=document.createElement('div');b.className='boule';b.style.left=sx+'px';b.style.top=sy+'px';ar.appendChild(b);requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transform=`translate(${e.x+29-sx}px,${e.y+35-sy}px)`}));setTimeout(()=>b.remove(),200);const dg=d.querySelector('.dragon');dg.classList.remove('souffle');void dg.offsetWidth;dg.classList.add('souffle')};
 onKey=k=>{if(k==='Escape'){G.run?pause():go('carte');return}if(!G.run){if(k===' '&&!ar.querySelector('.voile .chiffres'))depart();return}const cands=G.eggs.filter(e=>e.l===k);if(!cands.length){G.ko++;flashTouche(k,false);SFX.ko();return}const e=cands.reduce((m,e)=>e.y>m.y?e:m);flashTouche(k,true);noteTouche(k,true);tir(e);G.eggs=G.eggs.filter(x=>x!==e);setTimeout(()=>{G.eggs.push(e);retire(e,'eclot')},180);SFX.pop();G.score++;majScore();if(G.score%6===0){G.speed*=1.09;G.interval=Math.max(G.min,G.interval*.92);toast('Niveau '+(G.score/6+1)+' !')}};

 <div class="carte reglages">
  <div class="reglage"><div><label for="inNom2">Prénom</label></div><input id="inNom2" maxlength="16" value="${esc(S.name)}" style="font:500 1.05rem var(--body);padding:8px 12px;border-radius:10px;border:2px solid var(--parchemin2);min-width:0;width:200px;max-width:100%"></div>
  <div class="reglage"><div><span class="lbl">Niveau</span><p>Change la longueur des mots et la vitesse des jeux.</p></div><div class="choix" style="margin:0"><button data-age="petits" aria-pressed="${S.age==='petits'}">CP – CE1</button><button data-age="grands" aria-pressed="${S.age==='grands'}">CE2 – CM2</button></div></div>
  <div class="reglage"><div><span class="lbl">Bruitages</span><p>Petits sons à chaque touche, victoire et défaite.</p></div>${sw('swSon',S.sound)}</div>
  <div class="reglage"><div><span class="lbl">Aide vocale</span><p>Si l'enfant hésite plus d'une seconde, la lettre ou le mot est lu à voix haute.</p></div>${sw('swVoix',S.voice)}</div>
  <div class="reglage"><div><span class="lbl">Couleurs des doigts sur le clavier</span><p>Un trait de couleur sous chaque touche montre le doigt à utiliser.</p></div>${sw('swZones',S.zones)}</div>
  <div class="btns" style="justify-content:flex-start"><button class="btn vert" id="ok">Enregistrer</button></div>
 </div>
 <p style="color:var(--ciel-doux);font-size:.85rem;max-width:60ch">La progression est gardée dans ce navigateur, sur cet ordinateur. Elle n'est pas envoyée ailleurs.</p>`;
 $('#retour').onclick=()=>go('carte');
 main.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{S.age=b.dataset.age;main.querySelectorAll('[data-age]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
 [['swSon','sound'],['swVoix','voice'],['swZones','zones']].forEach(([id,k])=>$('#'+id).onclick=e=>{S[k]=!S[k];e.currentTarget.setAttribute('aria-checked',S[k]);if(k==='voice'&&S.voice)dire('Bonjour !');if(k==='sound'&&S.sound){ac();SFX.pop()}});
 $('#ok').onclick=()=>{S.name=$('#inNom2').value.trim();save();go('carte')};
};

go('carte');
</script>

</body>
</html>
